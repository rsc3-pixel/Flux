<?xml version="1.0" encoding="UTF-8"?>
<!--
  Flux brand mark — compact tile for tiny sizes (favicon 16/32px, sidebar 22px,
  PWA icon 192/512px). Same shapes as flux-logo.svg, scaled into a 64x64 canvas
  with a rounded rectangle background so it reads as an "app icon".

  Geometry: the original logo viewBox is 539.78 x 706.14, scaled by 0.068 and
  translated to leave 8px of padding on each side. Single-colour white on the
  blue tile — the tile itself supplies the contrast in any theme, so this file
  doesn't need a dark-mode variant.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Flux">
  <rect width="64" height="64" rx="14" fill="#0057d1"/>
  <g transform="translate(13.65 8) scale(0.068)" fill="#ffffff">
    <polygon points="88.99 68.42 384.15 68.42 384.15 0 539.78 124.77 384.15 252.22 384.15 183.8 138.63 183.8 185.59 287.11 113.14 287.11 72.89 330.04 8.5 186.48 88.99 68.42"/>
    <polygon points="123.43 306.34 8.5 421.71 8.5 552.3 47.4 599.7 0 648 192.3 706.14 177.09 466.43 131.48 517.42 83.18 421.71 270.28 421.71 270.28 487.9 408.75 365.61 270.28 235.68 270.28 306.34 123.43 306.34"/>
  </g>
</svg>
