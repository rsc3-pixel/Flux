<?xml version="1.0" encoding="UTF-8"?>
<!--
  Flux brand mark — simplified for tiny sizes (favicon, sidebar).
  Same concept as full logo but blockier and on a 1:1 canvas with a rounded
  background tile so it reads at 16/24/32px.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Flux">
  <!-- Rounded square background -->
  <rect width="64" height="64" rx="14" fill="#0052CC"/>
  <!-- White F made of arrows -->
  <g fill="#ffffff">
    <!-- Top arrow -->
    <path d="M 14 16 L 38 16 L 38 12 L 50 20 L 38 28 L 38 24 L 14 24 Z"/>
    <!-- Middle arrow (indented) -->
    <path d="M 19 30 L 36 30 L 36 26 L 46 34 L 36 42 L 36 38 L 19 38 Z"/>
    <!-- Bottom arrow (indented more, smaller) -->
    <path d="M 24 44 L 32 44 L 32 40 L 42 48 L 32 56 L 32 52 L 24 52 Z"/>
  </g>
</svg>
