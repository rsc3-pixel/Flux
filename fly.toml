# Flux — Fly.io configuration
# Replace `app` with the unique name you choose during `fly launch`
# (the name you pick becomes part of your URL: <app>.fly.dev).
#
# Region "gru" = São Paulo (low latency for Brazil). Other options:
#   "gig" Rio de Janeiro · "scl" Santiago · "iad" Virginia (US) · "ams" Amsterdam.

app = "flux-CHANGE-ME"
primary_region = "gru"

[build]
  # Uses Dockerfile in repo root.

[env]
  NODE_ENV = "production"
  DATA_DIR = "/data"
  # ALLOW_REGISTRATION is set as a secret via `fly secrets set ALLOW_REGISTRATION=false`
  # so cadastros novos ficam fechados após você criar sua conta.

# Persistent volume that holds the SQLite database. Survives deploys, restarts,
# region migrations. Free tier includes up to 3 GB across all volumes.
[[mounts]]
  source = "flux_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"     # stay on 24/7 for instant access from phone
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256                # plenty for a single-tenant kanban
